<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background Gradient Circle -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24" />
      <stop offset="100%" style="stop-color:#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Decorative Background Elements -->
  <circle cx="320" cy="60" r="80" fill="url(#bgGrad)">
    <animate attributeName="r" values="80;85;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="240" r="60" fill="url(#bgGrad)">
    <animate attributeName="r" values="60;65;60" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Math Symbols -->
  <g fill="#6366f1" opacity="0.3">
    <text x="50" y="80" font-size="24" font-family="serif">∑</text>
    <text x="340" y="200" font-size="20" font-family="serif">π</text>
    <text x="300" y="100" font-size="18" font-family="serif">∞</text>
    <text x="70" y="180" font-size="22" font-family="serif">Δ</text>
  </g>

  <!-- Desk -->
  <rect x="100" y="220" width="200" height="12" rx="3" fill="#374151"/>
  <rect x="110" y="232" width="8" height="40" rx="2" fill="#4b5563"/>
  <rect x="282" y="232" width="8" height="40" rx="2" fill="#4b5563"/>

  <!-- Open Book -->
  <g transform="translate(140, 160)">
    <!-- Left Page -->
    <path d="M60 0 L60 55 Q30 50 0 55 L0 5 Q30 0 60 0Z" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Right Page -->
    <path d="M60 0 L60 55 Q90 50 120 55 L120 5 Q90 0 60 0Z" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Book Spine -->
    <line x1="60" y1="0" x2="60" y2="55" stroke="url(#bookGrad)" stroke-width="3"/>
    <!-- Text Lines Left -->
    <line x1="10" y1="15" x2="50" y2="15" stroke="#d1d5db" stroke-width="2"/>
    <line x1="10" y1="25" x2="45" y2="25" stroke="#d1d5db" stroke-width="2"/>
    <line x1="10" y1="35" x2="48" y2="35" stroke="#d1d5db" stroke-width="2"/>
    <!-- Text Lines Right -->
    <line x1="70" y1="15" x2="110" y2="15" stroke="#d1d5db" stroke-width="2"/>
    <line x1="70" y1="25" x2="105" y2="25" stroke="#d1d5db" stroke-width="2"/>
    <line x1="70" y1="35" x2="108" y2="35" stroke="#d1d5db" stroke-width="2"/>
  </g>

  <!-- Pencil -->
  <g transform="translate(270, 180) rotate(25)">
    <rect x="0" y="0" width="50" height="8" rx="1" fill="#fbbf24"/>
    <polygon points="50,0 60,4 50,8" fill="#374151"/>
    <rect x="0" y="0" width="8" height="8" rx="1" fill="#f472b6"/>
  </g>

  <!-- Light Bulb (Idea) -->
  <g transform="translate(180, 50)">
    <circle cx="20" cy="20" r="18" fill="#fef3c7" stroke="#fbbf24" stroke-width="2">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M12 38 L28 38 L26 32 L14 32 Z" fill="#fbbf24"/>
    <line x1="15" y1="42" x2="25" y2="42" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="46" x2="24" y2="46" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <!-- Light Rays -->
    <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="20" y1="-5" x2="20" y2="-12">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
      </line>
      <line x1="38" y1="10" x2="45" y2="5">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      </line>
      <line x1="2" y1="10" x2="-5" y2="5">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      </line>
    </g>
  </g>

  <!-- Graduation Cap -->
  <g transform="translate(310, 140)">
    <polygon points="30,10 0,25 30,40 60,25" fill="#374151"/>
    <rect x="20" y="5" width="20" height="8" rx="2" fill="#374151"/>
    <line x1="50" y1="25" x2="55" y2="45" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="55" cy="48" r="4" fill="#fbbf24"/>
  </g>

  <!-- Stars decoration -->
  <g fill="#6366f1" opacity="0.4">
    <polygon points="30,120 32,126 38,126 33,130 35,136 30,132 25,136 27,130 22,126 28,126">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="360,160 361,164 365,164 362,166 363,170 360,168 357,170 358,166 355,164 359,164">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
