<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Circle Background -->
  <circle cx="60" cy="60" r="55" fill="url(#logoGrad1)" filter="url(#shadow)"/>

  <!-- Inner Circle -->
  <circle cx="60" cy="60" r="45" fill="white" opacity="0.1"/>

  <!-- Book Shape -->
  <g transform="translate(30, 35)">
    <!-- Left Page -->
    <path d="M30 0 C20 0 10 5 10 10 L10 45 C10 45 20 40 30 40 L30 0Z" fill="white" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M30 0 C40 0 50 5 50 10 L50 45 C50 45 40 40 30 40 L30 0Z" fill="white" opacity="0.9"/>
    <!-- Spine -->
    <line x1="30" y1="0" x2="30" y2="40" stroke="url(#logoGrad2)" stroke-width="3"/>

    <!-- Text lines left -->
    <line x1="15" y1="12" x2="26" y2="12" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="24" y2="20" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="28" x2="25" y2="28" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>

    <!-- Text lines right -->
    <line x1="34" y1="12" x2="45" y2="12" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="20" x2="43" y2="20" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="28" x2="44" y2="28" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Graduation Cap on top -->
  <g transform="translate(35, 15)">
    <polygon points="25,8 5,18 25,28 45,18" fill="url(#logoGrad2)"/>
    <rect x="18" y="2" width="14" height="8" rx="2" fill="url(#logoGrad2)"/>
    <!-- Tassel -->
    <line x1="40" y1="18" x2="48" y2="28" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="48" cy="30" r="3" fill="#f59e0b"/>
  </g>

  <!-- Sparkle -->
  <circle cx="95" cy="30" r="4" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="85" r="3" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
