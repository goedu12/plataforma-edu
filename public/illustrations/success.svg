<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Celebration Circles -->
  <circle cx="100" cy="100" r="60" fill="#d1fae5" opacity="0.5">
    <animate attributeName="r" values="60;65;60" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="45" fill="#a7f3d0" opacity="0.5">
    <animate attributeName="r" values="45;48;45" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Check Circle -->
  <circle cx="100" cy="100" r="35" fill="url(#successGrad)">
    <animate attributeName="r" values="35;37;35" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Check Mark -->
  <polyline points="80,100 95,115 125,85" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animate attributeName="stroke-dasharray" values="0,100;60,100" dur="0.5s" fill="freeze"/>
  </polyline>

  <!-- Confetti Stars -->
  <g fill="url(#starGrad)">
    <polygon points="40,40 42,48 50,48 44,53 46,61 40,56 34,61 36,53 30,48 38,48">
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 40 50;360 40 50" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="160,50 161,55 166,55 162,58 163,63 160,60 157,63 158,58 154,55 159,55">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 160 56;-360 160 56" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="50,150 51,155 56,155 52,158 53,163 50,160 47,163 48,158 44,155 49,155">
      <animate attributeName="opacity" values="1;0.5;1" dur="0.8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="155,145 156,150 161,150 157,153 158,158 155,155 152,158 153,153 149,150 154,150">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Sparkles -->
  <g stroke="#10b981" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="80" x2="25" y2="75">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="90" x2="175" y2="85">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="75" y1="160" x2="70" y2="165">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </line>
  </g>
</svg>
