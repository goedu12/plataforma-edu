<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="150" cy="100" r="70" fill="url(#emptyGrad)" opacity="0.5">
    <animate attributeName="r" values="70;75;70" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Empty Box -->
  <g transform="translate(100, 55)">
    <!-- Box Back -->
    <path d="M10 30 L50 10 L90 30 L50 50 Z" fill="#a5b4fc" opacity="0.5"/>
    <!-- Box Left Side -->
    <path d="M10 30 L10 70 L50 90 L50 50 Z" fill="#818cf8"/>
    <!-- Box Right Side -->
    <path d="M90 30 L90 70 L50 90 L50 50 Z" fill="#6366f1"/>
    <!-- Box Lid Left -->
    <path d="M10 30 L50 50 L50 40 L10 20 Z" fill="#c7d2fe">
      <animate attributeName="d"
        values="M10 30 L50 50 L50 40 L10 20 Z;M10 25 L50 45 L50 35 L10 15 Z;M10 30 L50 50 L50 40 L10 20 Z"
        dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Box Lid Right -->
    <path d="M90 30 L50 50 L50 40 L90 20 Z" fill="#e0e7ff">
      <animate attributeName="d"
        values="M90 30 L50 50 L50 40 L90 20 Z;M90 25 L50 45 L50 35 L90 15 Z;M90 30 L50 50 L50 40 L90 20 Z"
        dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Question Mark -->
  <g transform="translate(140, 75)">
    <text x="0" y="0" font-size="30" font-family="Arial" fill="#6366f1" font-weight="bold">?</text>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- Floating Dots -->
  <circle cx="80" cy="50" r="4" fill="#a5b4fc">
    <animate attributeName="cy" values="50;45;50" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="60" r="3" fill="#c7d2fe">
    <animate attributeName="cy" values="60;55;60" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="140" r="5" fill="#818cf8" opacity="0.5">
    <animate attributeName="cy" values="140;135;140" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
